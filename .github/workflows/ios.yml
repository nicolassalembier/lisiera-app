name: Build Lisiera iOS (TestFlight)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Contrôle des secrets Apple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            eval "v=\${$n}"
            test -n "$v" || { echo "::error::Secret $n manquant"; exit 1; }
          done
          xcodebuild -version
      - name: Projet Capacitor 8 iOS
        run: |
          npm init -y
          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/core@8 @capacitor/ios@8 @capacitor/share@8 @capacitor/app@8 "@capacitor-community/background-geolocation@^1.3.1"
          npm install --no-audit --no-fund --legacy-peer-deps -D @capacitor/cli@8
          cat > capacitor.config.json <<'EOF2'
          {
            "appId": "fr.lisiera.app",
            "appName": "Lisiera",
            "webDir": "www",
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          EOF2
      - name: Page web de l'application
        run: |
          mkdir -p www
          curl -fsSL https://lisiera.fr/app.html -o www/index.html
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js || curl -fsSL https://cdn.jsdelivr.net/npm/@capacitor/core@8/dist/capacitor.js -o www/capacitor.js
          LISIERA_CHANNEL=ios GITHUB_RUN_NUMBER=${{ github.run_number }} python3 patch_index.py www/index.html
          python3 patch_ios.py web www/index.html
      - name: Projet iOS
        run: |
          npx cap add ios
          python3 patch_ios.py native
          npx cap sync ios
          ls ios/App
      - name: Clé App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          python3 - <<'PY'
          import os, re, textwrap
          raw = os.environ['ASC_KEY_P8']
          body = re.sub(r'-----[A-Z ]+-----|\s+', '', raw)
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(textwrap.wrap(body, 64)) + '\n-----END PRIVATE KEY-----\n'
          open(os.path.join(os.environ['RUNNER_TEMP'], 'asc', 'AuthKey_' + os.environ['ASC_KEY_ID'] + '.p8'), 'w').write(pem)
          PY
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          openssl pkcs8 -in "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" -nocrypt -out /dev/null || { echo "::error::Le secret ASC_KEY_P8 n'est pas une clé .p8 valide"; exit 1; }
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lisiera.xcarchive" \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER=fr.lisiera.app \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Export signé (App Store)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOP
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOP
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lisiera.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -l "$RUNNER_TEMP/export"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
      - name: Envoi vers TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_KEY_P8 }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'false'
      - name: Effacer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

