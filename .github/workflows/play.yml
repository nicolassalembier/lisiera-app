name: Build Lisiera Play (AAB)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Licences Android
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
      - name: Clé de signature (secret)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64" || { echo "Secret ANDROID_KEYSTORE_B64 manquant"; exit 1; }
          mkdir -p ~/.android ~/.config/.android
          echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
          cp ~/.android/debug.keystore ~/.config/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore ~/.config/.android/debug.keystore
      - name: Contrôle de la clé d'importation
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > key.txt || { echo "::error::Alias androiddebugkey ou mot de passe android incorrect : la clé ne correspond pas à ce que le build attend"; exit 1; }
          {
            echo "### Clé d'importation"
            echo '```'
            grep -E "Owner:|Signature algorithm name|Subject Public Key Algorithm|Valid from|SHA256:" key.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q "CN=Android Debug" key.txt; then
            echo "::warning::Certificat nommé Android Debug : la Play Console risque de refuser l'AAB. Voir le résumé du job."
          fi
      - name: Projet Capacitor 8
        run: |
          npm init -y
          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/core@8 @capacitor/android@8 @capacitor/share@8 @capacitor/app@8 "@capacitor-community/background-geolocation@^1.3.1"
          npm install --no-audit --no-fund --legacy-peer-deps -D @capacitor/cli@8
          cat > capacitor.config.json <<'EOF2'
          {
            "appId": "fr.lisiera.app",
            "appName": "Lisiera",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "android": { "useLegacyBridge": true },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          EOF2
      - name: Page web de l'application
        run: |
          mkdir -p www
          curl -fsSL https://lisiera.fr/app.html -o www/index.html
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js || curl -fsSL https://cdn.jsdelivr.net/npm/@capacitor/core@8/dist/capacitor.js -o www/capacitor.js
          python3 patch_index.py www/index.html
      - name: Projet Android
        run: |
          npx cap add android
          python3 patch_android.py
          python3 patch_walker.py
          python3 patch_release.py
          npx cap sync android
      - name: Icône de l'application
        run: |
          npm install --no-save --no-audit --no-fund --legacy-peer-deps sharp
          node make_icons.js
      - name: Compiler l'AAB et l'APK de test
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
      - name: Contrôle du build
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging android/app/build/outputs/apk/release/app-release.apk > badging.txt
          {
            echo "### Contrôle du build Play"
            echo '```'
            grep -E "^package:|^sdkVersion|^targetSdkVersion" badging.txt || true
            echo '```'
            echo "#### Permissions déclarées"
            echo '```'
            grep -E "^uses-permission" badging.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          RAW=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep 'certificate SHA-256 digest' | head -1 | sed 's/.*: *//')
          FP=$(echo "$RAW" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "### Empreinte SHA-256 de la clé d'importation" >> "$GITHUB_STEP_SUMMARY"
          echo "$FP" >> "$GITHUB_STEP_SUMMARY"
      - name: Publier l'AAB et l'APK de test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab Lisiera-play.aab
          cp android/app/build/outputs/apk/release/app-release.apk Lisiera-play-test.apk
          gh release create "play-${{ github.run_number }}" Lisiera-play.aab Lisiera-play-test.apk --repo "$GITHUB_REPOSITORY" --prerelease --title "Lisiera Play ${{ github.run_number }}" --notes "AAB pour la Play Console et APK de test (Capacitor 8, cible API 36)."
