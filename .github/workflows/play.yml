name: Build Lisiera Play (AAB)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Licences Android
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
      - name: Clé d'importation
        env:
          PASS: ${{ secrets.UPLOAD_KS_PASSWORD }}
        run: |
          test -f upload.jks || { echo "::error::upload.jks absent : lancez d'abord le workflow Créer la clé d'importation Play"; exit 1; }
          test -n "$PASS" || { echo "::error::Secret UPLOAD_KS_PASSWORD manquant"; exit 1; }
          keytool -list -v -keystore upload.jks -storetype PKCS12 -storepass "$PASS" -alias upload > key.txt || { echo "::error::Mot de passe ou alias incorrect pour upload.jks"; exit 1; }
          if grep -q "CN=Android Debug" key.txt; then echo "::error::Certificat de debug : interdit pour la Play Console"; exit 1; fi
          {
            echo "### Clé d'importation"
            echo '```'
            grep -E "Owner:|Signature algorithm name|Subject Public Key Algorithm|Valid from|SHA256:" key.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Projet Capacitor 8
        run: |
          npm init -y
          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/core@8 @capacitor/android@8 @capacitor/share@8 @capacitor/app@8 "@capacitor-community/background-geolocation@^1.3.1"
          npm install --no-audit --no-fund --legacy-peer-deps -D @capacitor/cli@8
          cat > capacitor.config.json <<'EOF2'
          {
            "appId": "fr.lisiera.app",
            "appName": "Lisiera",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "android": { "useLegacyBridge": true },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          EOF2
      - name: Page web de l'application
        run: |
          mkdir -p www
          curl -fsSL https://lisiera.fr/app.html -o www/index.html
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js || curl -fsSL https://cdn.jsdelivr.net/npm/@capacitor/core@8/dist/capacitor.js -o www/capacitor.js
          LISIERA_CHANNEL=play GITHUB_RUN_NUMBER=$(( ${{ github.run_number }} + 100 )) python3 patch_index.py www/index.html
      - name: Projet Android
        run: |
          npx cap add android
          python3 patch_android.py
          python3 patch_walker.py
          python3 patch_release.py
          npx cap sync android
      - name: Icône de l'application
        run: |
          npm install --no-save --no-audit --no-fund --legacy-peer-deps sharp
          node make_icons.js
      - name: Compiler l'AAB et l'APK de test
        working-directory: android
        env:
          UPLOAD_KS_FILE: ${{ github.workspace }}/upload.jks
          UPLOAD_KS_PASS: ${{ secrets.UPLOAD_KS_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
      - name: Contrôle du build
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging android/app/build/outputs/apk/release/app-release.apk > badging.txt
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk > certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::L'APK est signé avec la clé de debug"; exit 1; fi
          {
            echo "### Contrôle du build Play"
            echo '```'
            grep -E "^package:|^sdkVersion|^targetSdkVersion" badging.txt || true
            echo '```'
            echo "#### Permissions déclarées"
            echo '```'
            grep -E "^uses-permission" badging.txt || true
            echo '```'
            echo "#### Signature"
            echo '```'
            grep -E "certificate DN|certificate SHA-256" certs.txt | head -2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publier l'AAB et l'APK de test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab Lisiera-play.aab
          cp android/app/build/outputs/apk/release/app-release.apk Lisiera-play-test.apk
          gh release create "play-${{ github.run_number }}" Lisiera-play.aab Lisiera-play-test.apk --repo "$GITHUB_REPOSITORY" --prerelease --title "Lisiera Play ${{ github.run_number }}" --notes "AAB pour la Play Console et APK de test (Capacitor 8, cible API 36)."
