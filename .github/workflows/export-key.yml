name: Export signing key (one-off)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Restore cached key
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.config/.android/debug.keystore
            ~/.android/debug.keystore
          key: lisiera-debug-keystore-v2
          fail-on-cache-miss: true
      - name: Store key in a secret
        env:
          GH_TOKEN: ${{ secrets.TEMP_PAT }}
        run: |
          KS=$(ls ~/.android/debug.keystore ~/.config/.android/debug.keystore 2>/dev/null | head -1)
          test -n "$KS"
          keytool -list -v -keystore "$KS" -storepass android | grep 'SHA256:'
          base64 -w0 "$KS" | gh secret set ANDROID_KEYSTORE_B64 --repo "$GITHUB_REPOSITORY"
