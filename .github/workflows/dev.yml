name: Build Lisiera Dev (APK de test)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Licences Android
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
      - name: Clé de signature (secret)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64" || { echo "::error::Secret ANDROID_KEYSTORE_B64 manquant"; exit 1; }
          mkdir -p ~/.android ~/.config/.android
          echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
          cp ~/.android/debug.keystore ~/.config/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore ~/.config/.android/debug.keystore
      - name: Projet Capacitor 8
        run: |
          npm init -y
          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/core@8 @capacitor/android@8 @capacitor/share@8 @capacitor/app@8 "@capacitor-community/background-geolocation@^1.3.1"
          npm install --no-audit --no-fund --legacy-peer-deps -D @capacitor/cli@8
          cat > capacitor.config.json <<'EOF2'
          {
            "appId": "fr.lisiera.app",
            "appName": "Lisiera Dev",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "android": { "useLegacyBridge": true },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          EOF2
      - name: Page web de test (app-dev.html)
        run: |
          mkdir -p www
          curl -fsSL https://lisiera.fr/app-dev.html -o www/index.html
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js || curl -fsSL https://cdn.jsdelivr.net/npm/@capacitor/core@8/dist/capacitor.js -o www/capacitor.js
          LISIERA_CHANNEL=dev GITHUB_RUN_NUMBER=$(( ${{ github.run_number }} + 1000 )) python3 patch_index.py www/index.html
      - name: Projet Android
        run: |
          npx cap add android
          python3 patch_android.py
          python3 patch_walker.py
          python3 patch_dev.py
          npx cap sync android
      - name: Icône orange
        run: |
          npm install --no-save --no-audit --no-fund --legacy-peer-deps sharp
          node make_icons.js
          node mark_dev_icon.js
      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Contrôle du build
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging android/app/build/outputs/apk/debug/app-debug.apk > badging.txt
          grep -q "^package: name='fr.lisiera.app.dev'" badging.txt || { echo "::error::Identifiant inattendu : cet APK n'est pas la version dev"; grep "^package:" badging.txt; exit 1; }
          {
            echo "### Contrôle du build dev"
            echo '```'
            grep -E "^package:|^application-label:" badging.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publier (pré-version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Lisiera-dev.apk
          gh release create "dev-${{ github.run_number }}" Lisiera-dev.apk --repo "$GITHUB_REPOSITORY" --prerelease --title "Lisiera Dev ${{ github.run_number }}" --notes "APK de test (fr.lisiera.app.dev), à côté de l'appli du test fermé Google."
          # lien stable : toujours la dernière version dev
          if gh release view dev-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload dev-latest Lisiera-dev.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit dev-latest --repo "$GITHUB_REPOSITORY" --prerelease --title "Lisiera Dev (dernière version)" --notes "Build ${{ github.run_number }}"
          else
            gh release create dev-latest Lisiera-dev.apk --repo "$GITHUB_REPOSITORY" --prerelease --title "Lisiera Dev (dernière version)" --notes "Build ${{ github.run_number }}"
          fi
