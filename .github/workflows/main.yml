name: Build Lisiera Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Licences Android
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true


      - name: Clé de signature stable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lisiera-debug-keystore-v1

      - name: Projet Capacitor
        run: |
          npm init -y
          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/core@7 @capacitor/android@7 @capacitor/share@7 @capacitor/app@7 @capacitor-community/background-geolocation
          npm install --no-audit --no-fund --legacy-peer-deps -D @capacitor/cli@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "fr.lisiera.app",
            "appName": "Lisiera",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF

      - name: Page web de l'application
        run: |
          mkdir -p www
          curl -fsSL https://lisiera.fr/index.html -o www/index.html
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js || curl -fsSL https://cdn.jsdelivr.net/npm/@capacitor/core@7/dist/capacitor.js -o www/capacitor.js
          python3 patch_index.py www/index.html

      - name: Projet Android
        run: |
          npx cap add android
          python3 patch_android.py
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Lisiera.apk
          gh release create "apk-${{ github.run_number }}" Lisiera.apk --repo "$GITHUB_REPOSITORY" --title "Lisiera test ${{ github.run_number }}" --notes "APK de test (debug)."
